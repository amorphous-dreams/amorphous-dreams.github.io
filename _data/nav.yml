vault_nodes:
  - label: "Synthetic Dream Machine"
    href: "/vault/synthetic-dream-machine/"
    summary: "Canonical SDM, Amorphous Dreams development, and Wizard Thief Fighter priority line."
  - label: "Ars Magica"
    href: "/vault/Ars-Magica/"
    summary: "Open Ars corpus browser, errata layer, and ingestion pipeline scaffold."

vault_nexus:
  synthetic_dream_machine:
    key: "synthetic_dream_machine"
    label: "SDM Nexus"
    href: "/vault/synthetic-dream-machine/"
    aliases:
      - "/vault/Synthetic-Dream-Machine/"
    operator_nav:
      group_order:
        - "sdm_core"
        - "ad_ftls"
        - "ad_elyncia_chapters"
        - "ad_elyncia_additional"
        - "wtf_core"
        - "wtf_supplemental"
        - "other"
      groups:
        sdm_core:
          label: "Synthetic Dream Machine"
          match_paths:
            - "vault/Synthetic-Dream-Machine/Synthetic_Dream_Machine_"
        ad_ftls:
          label: "Amorphous Dreams · Flying Triremes and Laser Swords"
          match_paths:
            - "vault/Synthetic-Dream-Machine/Flying_Triremes_and_Laser_Swords/"
        ad_elyncia_chapters:
          label: "Amorphous Dreams · Elyncia Chapters"
          match_paths:
            - "vault/Synthetic-Dream-Machine/Elyncia/Elyncia_"
        ad_elyncia_additional:
          label: "Amorphous Dreams · Additional Elyncia files"
          match_paths:
            - "vault/Synthetic-Dream-Machine/Elyncia/"
        wtf_core:
          label: "Wizard Thief Fighter · Core Synthetic Dream Machine"
          match_paths:
            - "vault/Synthetic-Dream-Machine/Our_Golden_Age/"
            - "vault/Synthetic-Dream-Machine/Vastlands_Guidebook/"
            - "vault/Synthetic-Dream-Machine/Ultraviolet_Grasslands_and_the_Black_City_2e/"
        wtf_supplemental:
          label: "Wizard Thief Fighter · SDM Supplemental Materials"
          match_paths:
            - "vault/Synthetic-Dream-Machine/Eternal_Return_Key/"
            - "vault/Synthetic-Dream-Machine/Magitecnica/"
            - "vault/Synthetic-Dream-Machine/There_A_Red_Door/"
            - "vault/Synthetic-Dream-Machine/Synthetic-Dream-Machine-3rd-Party-License.md"
    books:
      - key: "quickstart"
        label: "Quickstart"
        href: "/vault/Synthetic-Dream-Machine/Synthetic_Dream_Machine_01_Quickstart/"
      - key: "paths_index"
        label: "Paths Index"
        href: "/vault/Synthetic-Dream-Machine/Synthetic_Dream_Machine_02_Paths_Index/"
      - key: "traits_index"
        label: "Traits Index"
        href: "/vault/Synthetic-Dream-Machine/Synthetic_Dream_Machine_03_Traits_Index/"
  ars_magica:
    key: "ars_magica"
    label: "Ars Magica Nexus"
    href: "/vault/Ars-Magica/"
    operator_nav:
      group_order:
        - "core_rulebooks"
        - "tribunal_books"
        - "realms_of_power"
        - "world_books"
        - "order_of_hermes"
        - "scenarios"
        - "sheets_and_mini_sagas"
        - "errata"
        - "legal"
        - "other"
      groups:
        core_rulebooks:
          label: "Core Rulebooks"
          match_paths:
            - "vault/Ars-Magica/books/ars-magica-5th-edition-standard-core-rulebook/"
        tribunal_books:
          label: "Tribunal Books"
          match_paths:
            - "vault/Ars-Magica/books/lion-and-the-lily-the-norman-tribunal/"
        realms_of_power:
          label: "Realms of Power"
          match_paths:
            - "vault/Ars-Magica/books/realms-of-power-"
        world_books:
          label: "World Books"
          match_paths:
            - "vault/Ars-Magica/books/hedge-magic-revised-edition/"
        order_of_hermes:
          label: "Order of Hermes"
          match_paths:
            - "vault/Ars-Magica/books/house-"
            - "vault/Ars-Magica/books/guardians-of-the-forests-"
        scenarios:
          label: "Scenarios"
          match_paths:
            - "vault/Ars-Magica/books/tales-of-"
            - "vault/Ars-Magica/books/hooks-"
        sheets_and_mini_sagas:
          label: "Sheets and Mini-Sagas"
          match_paths:
            - "vault/Ars-Magica/books/characters/"
            - "vault/Ars-Magica/books/mini-sagas/"
        errata:
          label: "Errata"
          match_paths:
            - "vault/Ars-Magica/errata/"
        legal:
          label: "Legal and License"
          match_paths:
            - "vault/Ars-Magica/legal/"
